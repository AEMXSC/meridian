<!DOCTYPE html>
<html>
  <head>
    <title>Meridian — Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="data:,">
    <!-- da-lit is vendored in the repo; resolve it relative to this demo page. -->
    <script type="importmap">
      { "imports": { "da-lit": "../../../deps/lit/dist/index.js" } }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Web fallback for Adobe Clean, so the demo app's type reads like Spectrum. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://da.live/nx/styles/nexter.css">
    <style>
      html { display: flex; } html, body { min-height: 100%; min-width: 100%; }
      body { display: block; background-color: white; }
      .mrd-demo-nav {
        position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 9999;
        display: flex; align-items: center; gap: 2px;
        background: #fff; border: 1px solid #e1e1e1; border-radius: 999px;
        padding: 5px 8px; box-shadow: 0 2px 12px rgb(0 0 0 / 14%);
        font: 600 12.5px/1 "Adobe Clean", "Source Sans 3", system-ui, sans-serif;
      }
      .mrd-demo-nav .tag { background: #2680eb; color: #fff; border-radius: 999px; padding: 3px 9px; letter-spacing: .04em; }
      .mrd-demo-nav a { color: #4b4b4b; text-decoration: none; padding: 3px 11px; border-radius: 999px; white-space: nowrap; }
      .mrd-demo-nav a:hover { background: #f0f0f0; color: #222; }
      .mrd-demo-nav .cur { color: #2680eb; padding: 3px 11px; white-space: nowrap; }
    </style>
    <!-- Demo bootstrap: installs the in-memory DA, then loads the real app. -->
    <script src="boot.js" type="module"></script>
  </head>
  <body>
    <div class="mrd-demo-nav">
      <span class="tag">DEMO</span>
      <a href="../../../../">Overview</a>
      <span class="cur">App prototype</span>
      <a href="../../../plugins/meridian/demo/">In-editor panel</a>
    </div>
  </body>
</html>

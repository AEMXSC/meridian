# Deploys the Meridian DEMO (tools/apps/meridian/demo) to GitHub Pages so the UX
# team can click through the real app flow without a DA session or IMS access.
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage demo site
        run: |
          mkdir -p _site/tools
          cp -r tools/. _site/tools/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=tools/apps/meridian/demo/">
          <title>Meridian Demo</title>
          <a href="tools/apps/meridian/demo/">Open the Meridian demo</a>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
